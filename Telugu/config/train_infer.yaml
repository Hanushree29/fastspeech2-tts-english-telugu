optimizer:
  anneal_rate: 0.3
  anneal_steps:
  - 12000
  - 16000
  - 18000
  batch_size: 16
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-09
  grad_acc_step: 1
  grad_clip_thresh: 1.0
  warm_up_step: 4000
  weight_decay: 0.0
path:
  ckpt_path: /kaggle/working/safe_ckpt
  log_path: ./output/log/Telugu
  result_path: ./output/result/Telugu
step:
  log_step: 100
  save_step: 1000
  synth_step: 1000
  total_step: 20000
  val_step: 500
